
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111">
<title>ЗЕРКАЛО 1</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101214;color:#eee;font-family:system-ui,-apple-system,sans-serif}
main{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px}
.mirror{width:min(410px,92vw);height:55vh;min-height:400px;border-radius:48% 48% 44% 44%;background:radial-gradient(ellipse at 50% 40%,#a1a7ac 0,#697177 27%,#343a3f 60%,#17191c 100%);box-shadow:inset 0 0 80px #0008,0 12px 40px #0008;display:flex;align-items:center;justify-content:center;text-align:center}
.logo{font-size:27px;letter-spacing:8px}
.hint{margin-top:12px;opacity:.5}
.panel{width:min(410px,92vw);margin-top:18px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
button{width:100%;border:1px solid #444;background:#202326;color:#eee;border-radius:15px;padding:15px 10px;font-size:15px;cursor:pointer}
button:active{background:#303438}
textarea{width:100%;height:105px;margin-top:10px;border-radius:15px;border:1px solid #444;background:#191b1e;color:#fff;padding:13px;font-size:16px;resize:vertical}
.actions{display:none;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}
.status{text-align:center;min-height:24px;margin:12px 0;color:#aaa;font-size:14px;overflow-wrap:anywhere}
.card,.pattern{background:#1a1c1f;border:1px solid #303338;border-radius:14px;padding:13px;margin:8px 0;font-size:14px;line-height:1.45;overflow-wrap:anywhere}
.date{font-size:11px;opacity:.55;margin-bottom:6px}
.small{font-size:12px;opacity:.65}
.danger{opacity:.65;font-size:12px;margin-top:14px}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}
.wide{margin-top:9px}
#input{display:none}
</style>
</head>
<body>
<main>
  <div class="mirror">
    <div>
      <div class="logo">ЗЕРКАЛО</div>
      <div class="hint">Я слушаю. Анализирую только по запросу.</div>
    </div>
  </div>

  <div class="panel">
    <div class="row">
      <button id="voice">🎙️ Сказать</button>
      <button id="write">⌨️ Написать</button>
      <button id="patterns">🔍 Найти закономерности</button>
      <button id="show">📖 Мои записи</button>
    </div>

    <textarea id="input" placeholder="Что хочешь сохранить?"></textarea>

    <div class="actions" id="actions">
      <button id="save">Сохранить</button>
      <button id="cancel">Отмена</button>
    </div>

    <button class="wide" id="send">📤 Передать записи для анализа</button>

    <div class="tools">
      <button id="backup">💾 Скачать резервную копию</button>
      <button id="restore">📥 Восстановить записи</button>
    </div>
    <input id="file" type="file" accept=".json,application/json" hidden>

    <div class="status" id="status" aria-live="polite"></div>
    <div id="result"></div>
    <div id="entries"></div>
    <button class="danger" id="clear">Удалить все записи</button>
  </div>
</main>

<script>
'use strict';

const KEY='zerkalo1_entries';
const $=id=>document.getElementById(id);
let entries=[];

function load(){
  try{
    const raw=localStorage.getItem(KEY);
    const data=raw?JSON.parse(raw):[];
    entries=Array.isArray(data)?data.filter(e=>
      e&&typeof e.text==='string'&&Number.isFinite(Number(e.t))
    ):[];
  }catch(e){
    entries=[];
    $('status').textContent='Не удалось прочитать записи. Не сохраняй новые данные, пока не проверим хранилище.';
  }
}

function persist(){
  try{
    localStorage.setItem(KEY,JSON.stringify(entries));
    return true;
  }catch(e){
    $('status').textContent='Не удалось сохранить данные. Возможно, переполнено хранилище браузера.';
    return false;
  }
}

function esc(s){
  return String(s).replace(/[&<>"']/g,c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
  }[c]));
}

function render(){
  $('entries').innerHTML=entries.slice().reverse().map(e=>
    `<div class="card"><div class="date">${esc(new Date(Number(e.t)).toLocaleString('ru-RU'))}</div>${esc(e.text)}</div>`
  ).join('');
}

function editor(on=true){
  $('input').style.display=on?'block':'none';
  $('actions').style.display=on?'grid':'none';
  if(on)$('input').focus();
}

function formatEntries(){
  return 'ЗЕРКАЛО 1 — ЗАПИСИ ДЛЯ АНАЛИЗА\n'+
    'Количество записей: '+entries.length+'\n\n'+
    entries.map((e,i)=>
      `${i+1}. ${new Date(Number(e.t)).toLocaleString('ru-RU')}\n${e.text}`
    ).join('\n\n');
}

$('write').onclick=()=>{
  editor(true);
  $('status').textContent='';
};

$('cancel').onclick=()=>{
  editor(false);
  $('input').value='';
};

$('save').onclick=()=>{
  const v=$('input').value.trim();
  if(!v)return;

  const oldLength=entries.length;
  entries.push({t:Date.now(),text:v});

  if(!persist()){
    entries.length=oldLength;
    return;
  }

  $('input').value='';
  editor(false);
  $('status').textContent='Записал.';
  render();
};

$('voice').onclick=()=>{
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){
    $('status').textContent='Голосовой ввод не поддерживается этим браузером. Используй «Написать».';
    return;
  }

  const r=new SR();
  r.lang='ru-RU';
  r.interimResults=false;
  r.maxAlternatives=1;
  $('status').textContent='Слушаю…';

  r.onresult=e=>{
    editor(true);
    $('input').value=e.results[0][0].transcript;
    $('status').textContent='Проверь текст и нажми «Сохранить».';
  };
  r.onerror=()=>{
    $('status').textContent='Не удалось распознать речь.';
  };
  r.start();
};

$('show').onclick=()=>{
  render();
  $('status').textContent=`Всего записей: ${entries.length}`;
};

$('patterns').onclick=()=>{
  if(entries.length<3){
    $('result').innerHTML='<div class="pattern"><b>Пока мало данных.</b><br>Оставь несколько записей. ЗЕРКАЛО не будет придумывать закономерности при недостатке данных.</div>';
    return;
  }

  const words={};
  entries.forEach(e=>{
    e.text.toLowerCase()
      .replace(/[^а-яёa-z0-9 ]/g,' ')
      .split(/\s+/)
      .filter(w=>w.length>=5)
      .forEach(w=>words[w]=(words[w]||0)+1);
  });

  const common=Object.entries(words)
    .filter(x=>x[1]>=2)
    .sort((a,b)=>b[1]-a[1])
    .slice(0,7);

  $('result').innerHTML=
    '<div class="pattern"><b>Повторяющиеся слова</b></div>'+
    (common.length
      ?common.map(x=>
        `<div class="pattern"><b>«${esc(x[0])}»</b><br><span class="small">${x[1]} упоминания. Это наблюдение, а не доказанная закономерность.</span></div>`
      ).join('')
      :'<div class="pattern">Повторяющихся ключевых слов пока не найдено.</div>')+
    '<div class="pattern"><b>Важно</b><br>Этот механизм считает слова. Он пока не устанавливает причинно-следственные связи между событиями.</div>';
};

$('send').onclick=async()=>{
  if(!entries.length){
    $('status').textContent='Пока нет записей для передачи.';
    return;
  }

  const data=formatEntries();

  try{
    if(!navigator.clipboard||!navigator.clipboard.writeText){
      throw new Error('Буфер обмена недоступен');
    }
    await navigator.clipboard.writeText(data);
    $('status').textContent=
      `Скопировано записей: ${entries.length}. Теперь открой чат ChatGPT, вставь текст и отправь его.`;
  }catch(e){
    const area=document.createElement('textarea');
    area.value=data;
    area.style.display='block';
    area.style.height='180px';
    $('result').replaceChildren(area);

    const btn=document.createElement('button');
    btn.textContent='Выделить записи для копирования';
    btn.className='wide';
    btn.onclick=()=>{
      area.focus();
      area.select();
      $('status').textContent='Выдели текст и выбери «Копировать». Затем вставь его в чат ChatGPT.';
    };
    $('result').appendChild(btn);
    $('status').textContent='Автоматическое копирование недоступно. Скопируй текст из поля ниже.';
  }
};

$('backup').onclick=()=>{
  const blob=new Blob([JSON.stringify(entries,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='zerkalo1-backup-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  $('status').textContent='Подготовлена резервная копия записей.';
};

$('restore').onclick=()=>{
  $('file').click();
};

$('file').onchange=async()=>{
  const file=$('file').files[0];
  if(!file)return;

  try{
    const data=JSON.parse(await file.text());
    if(!Array.isArray(data)||!data.every(e=>
      e&&typeof e.text==='string'&&Number.isFinite(Number(e.t))
    )){
      throw new Error('Неверный формат');
    }

    if(!confirm(`В файле ${data.length} записей. Добавить их к текущим? Дубликаты могут сохраниться.`))return;

    const old=entries;
    entries=old.concat(data.map(e=>({t:Number(e.t),text:e.text})));

    if(persist()){
      render();
      $('status').textContent=`Восстановлено записей: ${data.length}.`;
    }else{
      entries=old;
    }
  }catch(e){
    $('status').textContent='Не удалось восстановить записи. Проверь файл резервной копии.';
  }finally{
    $('file').value='';
  }
};

$('clear').onclick=()=>{
  if(!confirm('Удалить все записи? Сначала скачай резервную копию, если они важны.'))return;
  const old=entries;
  entries=[];
  if(persist()){
    render();
    $('result').innerHTML='';
    $('status').textContent='Записи удалены.';
  }else{
    entries=old;
  }
};

load();
render();
</script>
</body>
</html>
