<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><title>ЗЕРКАЛО 1</title><style>*{box-sizing:border-box}body{margin:0;background:#101214;color:#eee;font-family:system-ui,-apple-system,sans-serif}main{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px}.mirror{width:min(410px,92vw);height:55vh;min-height:400px;border-radius:48% 48% 44% 44%;background:radial-gradient(ellipse at 50% 40%,#a1a7ac 0,#697177 27%,#343a3f 60%,#17191c 100%);box-shadow:inset 0 0 80px #0008,0 12px 40px #0008;display:flex;align-items:center;justify-content:center;text-align:center}.logo{font-size:27px;letter-spacing:8px}.hint{margin-top:12px;opacity:.5}.panel{width:min(410px,92vw);margin-top:18px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}button{width:100%;border:1px solid #444;background:#202326;color:#eee;border-radius:15px;padding:15px 10px;font-size:15px}button:active{background:#303438}textarea{width:100%;height:105px;margin-top:10px;border-radius:15px;border:1px solid #444;background:#191b1e;color:#fff;padding:13px;font-size:16px;resize:none}.actions{display:none;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}.status{text-align:center;min-height:24px;margin:12px 0;color:#aaa;font-size:14px}.card,.pattern{background:#1a1c1f;border:1px solid #303338;border-radius:14px;padding:13px;margin:8px 0;font-size:14px;line-height:1.45}.date{font-size:11px;opacity:.4;margin-bottom:6px}.small{font-size:12px;opacity:.5}.danger{opacity:.55;font-size:12px;margin-top:14px}</style></head><body><main><div class="mirror"><div><div class="logo">ЗЕРКАЛО</div><div class="hint">Я слушаю. Анализирую только по запросу.</div></div></div><div class="panel"><div class="row"><button id="voice">🎙️ Сказать</button><button id="write">⌨️ Написать</button><button id="patterns">🔍 Найти закономерности</button><button id="show">📖 Мои записи</button></div><textarea id="input" placeholder="Что хочешь сохранить?"></textarea><div class="actions" id="actions"><button id="save">Сохранить</button><button id="cancel">Отмена</button></div><div class="status" id="status"></div><div id="result"></div><div id="entries"></div><button class="danger" id="clear">Удалить все записи</button></div></main><script>const KEY='zerkalo1_entries';let entries=JSON.parse(localStorage.getItem(KEY)||'[]');const $=x=>document.getElementById(x);function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function render(){$('entries').innerHTML=entries.slice().reverse().map(e=>`<div class="card"><div class="date">${new Date(e.t).toLocaleString('ru-RU')}</div>${esc(e.text)}</div>`).join('')}function editor(on=true){$('input').style.display=on?'block':'none';$('actions').style.display=on?'grid':'none';if(on)$('input').focus()}$('write').onclick=()=>editor(true);$('cancel').onclick=()=>{editor(false);$('input').value=''};$('save').onclick=()=>{let v=$('input').value.trim();if(!v)return;entries.push({t:Date.now(),text:v});localStorage.setItem(KEY,JSON.stringify(entries));$('input').value='';editor(false);$('status').textContent='Записал.';render()};$('voice').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('status').textContent='Голосовой ввод не поддерживается этим браузером. Используй «Написать».';return}const r=new SR();r.lang='ru-RU';r.interimResults=false;r.maxAlternatives=1;$('status').textContent='Слушаю…';r.onresult=e=>{editor(true);$('input').value=e.results[0][0].transcript;$('status').textContent=''};r.onerror=()=>{$('status').textContent='Не удалось распознать речь.'};r.start()};$('show').onclick=()=>{render();$('status').textContent=`Записей: ${entries.length}`};$('patterns').onclick=()=>{if(entries.length<3){$('result').innerHTML='<div class="pattern"><b>Пока мало данных.</b><br>Оставь несколько записей. Настоящее ЗЕРКАЛО не будет придумывать закономерности при недостатке данных.</div>';return}const words={};entries.forEach(e=>e.text.toLowerCase().replace(/[^а-яёa-z0-9 ]/g,' ').split(/\s+/).filter(w=>w.length>=5).forEach(w=>words[w]=(words[w]||0)+1));const common=Object.entries(words).filter(x=>x[1]>=2).sort((a,b)=>b[1]-a[1]).slice(0,7);$('result').innerHTML='<div class="pattern"><b>Первые наблюдения</b></div>'+(common.length?common.map(x=>`<div class="pattern"><b>Повторяется: «${esc(x[0])}»</b><br><span class="small">${x[1]} упоминания. Это только наблюдение, не доказанная закономерность.</span></div>`).join(''):'<div class="pattern">Повторяющихся ключевых слов пока не найдено.</div>')+'<div class="pattern"><b>Важно</b><br>Это учебный механизм ЗЕРКАЛА 1. Он пока ищет только повторяющиеся слова. Следующая версия должна сопоставлять события, состояние, время и разные источники данных.</div>')};$('clear').onclick=()=>{if(confirm('Удалить все записи?')){entries=[];localStorage.removeItem(KEY);render();$('result').innerHTML='';$('status').textContent='Записи удалены.'}};render();</script></body></html>
